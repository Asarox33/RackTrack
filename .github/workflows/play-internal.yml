name: Play Internal

# After CI succeeds on a push to main, if versionCode changed and Play SA secret
# is present: signed AAB → Internal testing (completed). Manual dispatch for smoke.
# Closed / Production stay manual. See docs/08-play-store.md.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

jobs:
  publish-internal:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Resolve checkout ref
        id: ref
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.sha }}
          fetch-depth: 0

      - name: Check Play service-account secret
        id: play_secret
        env:
          RACKTRACK_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.RACKTRACK_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [[ -z "${RACKTRACK_PLAY_SERVICE_ACCOUNT_JSON:-}" ]]; then
            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              echo "::error::Missing RACKTRACK_PLAY_SERVICE_ACCOUNT_JSON. Complete the owner checklist in docs/08-play-store.md"
              exit 1
            fi
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::RACKTRACK_PLAY_SERVICE_ACCOUNT_JSON not set — skipping Play Internal upload (CI stays green)."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect versionCode change
        id: version
        if: steps.play_secret.outputs.present == 'true'
        run: |
          set -euo pipefail
          NAME=$(grep -E '^racktrack\.versionName=' gradle.properties | cut -d= -f2)
          CODE=$(grep -E '^racktrack\.versionCode=' gradle.properties | cut -d= -f2)
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${CODE}" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch — will upload versionCode ${CODE}"
            exit 0
          fi
          PARENT="${{ steps.ref.outputs.sha }}^"
          if ! git rev-parse --verify "$PARENT" >/dev/null 2>&1; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "No parent commit — treating as versionCode change"
            exit 0
          fi
          PREV=$(git show "$PARENT:gradle.properties" 2>/dev/null | grep -E '^racktrack\.versionCode=' | cut -d= -f2 || true)
          if [[ -z "${PREV}" || "${PREV}" != "${CODE}" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "versionCode ${PREV:-∅} → ${CODE} — will upload"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::versionCode unchanged (${CODE}) — skip Play Internal upload"
          fi

      - name: Require signing secrets
        if: steps.play_secret.outputs.present == 'true' && steps.version.outputs.changed == 'true'
        env:
          RACKTRACK_KEYSTORE_BASE64: ${{ secrets.RACKTRACK_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "${RACKTRACK_KEYSTORE_BASE64:-}" ]]; then
            echo "::error::Missing RACKTRACK_KEYSTORE_BASE64 (and related signing secrets). See docs/08-play-store.md"
            exit 1
          fi

      - name: Set up JDK
        if: steps.play_secret.outputs.present == 'true' && steps.version.outputs.changed == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        if: steps.play_secret.outputs.present == 'true' && steps.version.outputs.changed == 'true'
        uses: gradle/actions/setup-gradle@v6

      - name: Decode upload keystore
        if: steps.play_secret.outputs.present == 'true' && steps.version.outputs.changed == 'true'
        env:
          RACKTRACK_KEYSTORE_BASE64: ${{ secrets.RACKTRACK_KEYSTORE_BASE64 }}
          RACKTRACK_KEYSTORE_PASSWORD: ${{ secrets.RACKTRACK_KEYSTORE_PASSWORD }}
          RACKTRACK_KEY_ALIAS: ${{ secrets.RACKTRACK_KEY_ALIAS }}
          RACKTRACK_KEY_PASSWORD: ${{ secrets.RACKTRACK_KEY_PASSWORD }}
        run: bash .github/scripts/setup-upload-signing.sh

      - name: Bundle release AAB
        if: steps.play_secret.outputs.present == 'true' && steps.version.outputs.changed == 'true'
        run: ./gradlew :app:bundleRelease

      - name: Extract Play whatsnew locales
        if: steps.play_secret.outputs.present == 'true' && steps.version.outputs.changed == 'true'
        run: bash .github/scripts/extract-play-whatsnew.sh play/internal-release-notes.txt "$RUNNER_TEMP/whatsnew"

      - name: Upload AAB artifact
        if: steps.play_secret.outputs.present == 'true' && steps.version.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload R8 mapping artifact
        if: steps.play_secret.outputs.present == 'true' && steps.version.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: app-release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish to Play Internal
        if: steps.play_secret.outputs.present == 'true' && steps.version.outputs.changed == 'true'
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.RACKTRACK_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.racktrack
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          mappingFile: app/build/outputs/mapping/release/mapping.txt
          whatsNewDirectory: ${{ runner.temp }}/whatsnew
