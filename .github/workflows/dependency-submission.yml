name: Dependency submission

# Replaces GitHub's automatic "submit-gradle" (Node 20 + read-only token → cache denied).
# Disable: Settings → Code security → Dependency graph → Automatic dependency submission → off

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v6
