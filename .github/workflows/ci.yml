name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: ktlint check
        run: ./gradlew ktlintCheck

      - name: detekt
        run: ./gradlew detekt

      - name: Unit tests (domain first)
        run: ./gradlew testDebugUnitTest

      # NOTE: this workflow assumes ktlint and detekt Gradle plugins are configured
      # as part of #SETUP-4 in docs/06-roadmap-todo.md. Until that setup task is done,
      # this workflow will fail — that failure is expected and intentional, not a bug.
