name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Need full history so coverage can diff PR base…head for changed lines.
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: ktlint check
        run: ./gradlew ktlintCheck

      - name: detekt
        run: ./gradlew detekt

      - name: Unit tests + domain coverage
        run: ./gradlew :app:domainCoverage

      - name: Domain coverage PR comment + gates
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/domain-coverage-pr.py

      - name: Coverage summary
        if: always() && hashFiles('shared/build/reports/jacoco/domainCoverage/domainCoverage.xml') != ''
        run: |
          python3 <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          xml_path = Path("shared/build/reports/jacoco/domainCoverage/domainCoverage.xml")
          root = ET.parse(xml_path).getroot()
          counters = {c.get("type"): c for c in root.findall("counter")}
          line = counters.get("LINE")
          if line is None:
              raise SystemExit("No LINE counter in JaCoCo report")
          missed = int(line.get("missed", 0))
          covered = int(line.get("covered", 0))
          total = missed + covered
          pct = (100.0 * covered / total) if total else 0.0
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          body = (
              "## Domain coverage (line)\n\n"
              f"- **Line coverage:** {pct:.1f}% ({covered}/{total})\n"
              f"- HTML report: artifact `domain-coverage`\n"
              f"- Local: `./gradlew :app:domainCoverage`\n"
              f"- PR decoration + instruction gates: "
              "`.github/scripts/domain-coverage-pr.py`\n"
          )
          print(body)
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write(body)
          PY

      - name: Upload coverage HTML
        if: always() && hashFiles('shared/build/reports/jacoco/domainCoverage/html/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: domain-coverage
          path: shared/build/reports/jacoco/domainCoverage/html
          if-no-files-found: ignore
