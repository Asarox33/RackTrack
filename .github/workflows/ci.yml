name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: ktlint check
        run: ./gradlew ktlintCheck

      - name: detekt
        run: ./gradlew detekt

      - name: Unit tests + domain coverage
        run: ./gradlew :app:domainCoverage

      - name: Coverage report on PR
        if: github.event_name == 'pull_request'
        id: jacoco
        uses: madrapps/jacoco-report@v1.8.0
        with:
          paths: ${{ github.workspace }}/shared/build/reports/jacoco/domainCoverage/domainCoverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Domain coverage
          update-comment: true
          # Madrapps uses instruction coverage (not line %). Domain overall ~85%.
          # Per-file emoji uses min-coverage-changed-files (was 0 → everything looked green).
          min-coverage-overall: 80
          min-coverage-changed-files: 80
          pass-emoji: ':green_circle:'
          fail-emoji: ':red_circle:'

      # madrapps only comments; it does not fail the job on its own.
      - name: Fail if PR coverage below 80%
        if: github.event_name == 'pull_request'
        env:
          OVERALL: ${{ steps.jacoco.outputs.coverage-overall }}
          CHANGED: ${{ steps.jacoco.outputs.coverage-changed-files }}
        run: |
          python3 <<'PY'
          import os
          import sys
          overall = float(os.environ.get("OVERALL") or "0")
          changed = float(os.environ.get("CHANGED") or "0")
          print(f"coverage-overall={overall}")
          print(f"coverage-changed-files={changed}")
          failed = False
          if overall < 80.0:
              print(f"::error::Overall domain coverage {overall}% < 80%")
              failed = True
          if changed < 80.0:
              print(f"::error::Changed-files domain coverage {changed}% < 80%")
              failed = True
          sys.exit(1 if failed else 0)
          PY
      - name: Coverage summary
        if: always() && hashFiles('shared/build/reports/jacoco/domainCoverage/domainCoverage.xml') != ''
        run: |
          python3 <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          xml_path = Path("shared/build/reports/jacoco/domainCoverage/domainCoverage.xml")
          root = ET.parse(xml_path).getroot()
          counters = {c.get("type"): c for c in root.findall("counter")}
          line = counters.get("LINE")
          if line is None:
              raise SystemExit("No LINE counter in JaCoCo report")
          missed = int(line.get("missed", 0))
          covered = int(line.get("covered", 0))
          total = missed + covered
          pct = (100.0 * covered / total) if total else 0.0
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          body = (
              "## Domain coverage\n\n"
              f"- **Line coverage:** {pct:.1f}% ({covered}/{total})\n"
              f"- HTML report uploaded as CI artifact `domain-coverage`\n"
              f"- Local: `./gradlew :app:domainCoverage` → "
              "`shared/build/reports/jacoco/domainCoverage/html/index.html`\n"
          )
          print(body)
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write(body)
          PY

      - name: Upload coverage HTML
        if: always() && hashFiles('shared/build/reports/jacoco/domainCoverage/html/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: domain-coverage
          path: shared/build/reports/jacoco/domainCoverage/html
          if-no-files-found: ignore
